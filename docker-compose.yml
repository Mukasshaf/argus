services:
  app:
    build:
      context: ./core
      dockerfile: ../docker/Dockerfile.dev
    container_name: argus_core
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Argus
      - APP_ENV=local
      - APP_KEY=base64:uJbK063bNqC6bKz4+JbK063bNqC6bKz4+JbK063bNqA=
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=argus
      - DB_USERNAME=argus
      - DB_PASSWORD=secret
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - SESSION_DRIVER=database
      - SIM_BASE_URL=http://otasim:8081
      - RAAHI_BASE_URL=http://otasim:8081/raahi
      - SARAI_BASE_URL=http://otasim:8081/sarai
      - MELA_STORAGE_PATH=/shared/sftp
    volumes:
      - ./core:/var/www/html
      - core_vendor:/var/www/html/vendor
      - sftp_shared:/shared/sftp
    command: sh -c "mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache && chmod -R 777 storage bootstrap/cache 2>/dev/null || true; php artisan package:discover --no-interaction; php artisan migrate --force --no-interaction; PHP_CLI_SERVER_WORKERS=8 php artisan serve --no-reload --host=0.0.0.0 --port=8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - argus_net

  mysql:
    image: mysql:8.0
    container_name: argus_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: argus
      MYSQL_USER: argus
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - argus_net

  worker:
    build:
      context: ./core
      dockerfile: ../docker/Dockerfile.dev
    container_name: argus_worker
    restart: unless-stopped
    command: sh -c "mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache && chmod -R 777 storage bootstrap/cache 2>/dev/null || true; php artisan package:discover --no-interaction; php artisan queue:work --queue=argus_ingest,argus_sync,default --tries=6 --max-time=3600"
    environment:
      - APP_NAME=Argus
      - APP_ENV=local
      - APP_KEY=base64:uJbK063bNqC6bKz4+JbK063bNqC6bKz4+JbK063bNqA=
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=argus
      - DB_USERNAME=argus
      - DB_PASSWORD=secret
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - SIM_BASE_URL=http://otasim:8081
      - RAAHI_BASE_URL=http://otasim:8081/raahi
      - SARAI_BASE_URL=http://otasim:8081/sarai
      - MELA_STORAGE_PATH=/shared/sftp
    volumes:
      - ./core:/var/www/html
      - core_vendor:/var/www/html/vendor
      - sftp_shared:/shared/sftp
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - argus_net

  scheduler:
    build:
      context: ./core
      dockerfile: ../docker/Dockerfile.dev
    container_name: argus_scheduler
    restart: unless-stopped
    command: sh -c "mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache && chmod -R 777 storage bootstrap/cache 2>/dev/null || true; php artisan package:discover --no-interaction; php artisan schedule:work"
    environment:
      - APP_NAME=Argus
      - APP_ENV=local
      - APP_KEY=base64:uJbK063bNqC6bKz4+JbK063bNqC6bKz4+JbK063bNqA=
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=argus
      - DB_USERNAME=argus
      - DB_PASSWORD=secret
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - SIM_BASE_URL=http://otasim:8081
      - RAAHI_BASE_URL=http://otasim:8081/raahi
      - SARAI_BASE_URL=http://otasim:8081/sarai
      - MELA_STORAGE_PATH=/shared/sftp
    volumes:
      - ./core:/var/www/html
      - core_vendor:/var/www/html/vendor
      - sftp_shared:/shared/sftp
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - argus_net

  otasim:
    build:
      context: ./otasim
      dockerfile: ../docker/Dockerfile.otasim
    container_name: argus_otasim
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - APP_NAME=OTASimulator
      - APP_ENV=local
      - APP_KEY=base64:uJbK063bNqC6bKz4+JbK063bNqC6bKz4+JbK063bNqB=
      - APP_DEBUG=true
      - APP_URL=http://localhost:8081
      - CORE_BASE_URL=http://app:8000
      - MELA_STORAGE_PATH=/shared/sftp
      # The simulator only owns the three sim_* tables, so it cannot use the
      # database session or cache drivers that Laravel defaults to.
      - SESSION_DRIVER=file
      - CACHE_STORE=file
      - CACHE_PREFIX=argus_otasim_cache
    volumes:
      - ./otasim:/var/www/html
      - otasim_vendor:/var/www/html/vendor
      - sftp_shared:/shared/sftp
    command: sh -c "mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache && chmod -R 777 storage bootstrap/cache 2>/dev/null || true; php artisan package:discover --no-interaction; touch database/otasim.sqlite; php artisan migrate --force --no-interaction; php artisan db:seed --force --no-interaction; PHP_CLI_SERVER_WORKERS=8 php artisan serve --no-reload --host=0.0.0.0 --port=8081"
    networks:
      - argus_net

volumes:
  mysql_data:
  core_vendor:
  otasim_vendor:
  sftp_shared:

networks:
  argus_net:
    name: argus_net
    driver: bridge
