services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    restart: always
    ports:
      - "80:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST}
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - QUEUE_CONNECTION=sqs
      - CACHE_STORE=database
      - LOG_CHANNEL=stderr
    volumes:
      - sftp_shared:/shared/sftp
    logging:
      driver: awslogs
      options:
        awslogs-group: /staybridge/production
        awslogs-region: ${AWS_DEFAULT_REGION:-ap-south-1}
        awslogs-stream: app

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    restart: always
    command: php artisan queue:work sqs --queue=staybridge_ingest,staybridge_sync,default --tries=6 --timeout=90
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST}
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - QUEUE_CONNECTION=sqs
      - CACHE_STORE=database
      - LOG_CHANNEL=stderr
    volumes:
      - sftp_shared:/shared/sftp
    logging:
      driver: awslogs
      options:
        awslogs-group: /staybridge/production
        awslogs-region: ${AWS_DEFAULT_REGION:-ap-south-1}
        awslogs-stream: worker

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    restart: always
    command: php artisan schedule:work
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST}
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - QUEUE_CONNECTION=sqs
      - CACHE_STORE=database
      - LOG_CHANNEL=stderr
    volumes:
      - sftp_shared:/shared/sftp

volumes:
  sftp_shared:
